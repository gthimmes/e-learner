# Overlay: run the stack on PostgreSQL instead of SQLite.
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  app:
    environment:
      DATABASE_URL: postgres://elearner:elearner@postgres:5432/elearner
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elearner
      POSTGRES_PASSWORD: elearner
      POSTGRES_DB: elearner
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearner"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data
volumes:
  pg-data:
