# Local production-like stack: app + Redis (shared rate limits) + MinIO (S3-compatible uploads).
# Usage: docker compose up --build   → http://localhost:3000  (seed with: docker compose exec app npm run db:seed)
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/app.db
      # Namespaced on purpose: compose interpolates from the repo .env, and the dev
      # SESSION_SECRET there is refused by production auth. Set ELEARNER_SESSION_SECRET.
      SESSION_SECRET: ${ELEARNER_SESSION_SECRET:-change-me-please-32-chars-minimum}
      APP_URL: http://localhost:3000
      REDIS_URL: redis://redis:6379
      S3_BUCKET: elearner
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "1"
      CRON_SECRET: ${ELEARNER_CRON_SECRET:-local-cron-secret}
    volumes:
      - app-data:/data
    depends_on:
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/elearner;
      "
  # Retry webhook deliveries every 5 minutes (any scheduler works; this one is self-contained).
  cron:
    image: curlimages/curl:latest
    depends_on:
      - app
    entrypoint: >
      /bin/sh -c "while true; do sleep 300; curl -fsS -X POST -H 'Authorization: Bearer ${ELEARNER_CRON_SECRET:-local-cron-secret}' http://app:3000/api/cron/webhooks || true; done"
volumes:
  app-data:
  minio-data:
